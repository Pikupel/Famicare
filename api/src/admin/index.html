<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Famicare Admin</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:system-ui,-apple-system,sans-serif; background:#f8f9ff; color:#0b1c30; }
.header { background:#00685f; color:white; padding:16px 24px; display:flex; justify-content:space-between; align-items:center; }
.header h1 { font-size:20px; }
.container { max-width:1200px; margin:0 auto; padding:24px; }
.card { background:white; border-radius:12px; padding:20px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; }
.stat { text-align:center; padding:16px; }
.stat-value { font-size:28px; font-weight:700; color:#00685f; }
.stat-label { font-size:12px; color:#64748b; margin-top:4px; }
table { width:100%; border-collapse:collapse; font-size:14px; }
th,td { text-align:left; padding:10px 8px; border-bottom:1px solid #e2e8f0; }
th { color:#64748b; font-weight:600; }
.btn { background:#00685f; color:white; border:none; border-radius:8px; padding:10px 20px; cursor:pointer; font-size:14px; margin-right:6px; }
.btn:hover { opacity:0.9; }
.btn-sm { padding:4px 12px; font-size:12px; }
.btn-danger { background:#ba1a1a; }
.btn-warning { background:#f59e0b; }
input,select { border:1px solid #e2e8f0; border-radius:8px; padding:8px 12px; font-size:14px; margin-bottom:12px; }
.tab { display:inline-block; padding:8px 16px; cursor:pointer; border-bottom:2px solid transparent; color:#64748b; }
.tab.active { border-bottom-color:#00685f; color:#00685f; font-weight:600; }
.tab-content { display:none; }
.tab-content.active { display:block; }
.log { font-family:monospace; font-size:12px; background:#1e293b; color:#22c55e; padding:16px; border-radius:8px; max-height:300px; overflow-y:auto; white-space:pre-wrap; }
.badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; }
.badge-green { background:#dcfce7; color:#16a34a; }
.badge-red { background:#fef2f2; color:#dc2626; }
.badge-blue { background:#dbeafe; color:#2563eb; }
</style>
</head>
<body>
<div class="header"><h1>⚙️ Famicare Admin</h1><a href="#" onclick="loadAll();return false" style="color:rgba(255,255,255,0.9)">🔄 Yenile</a></div>
<div class="container">
  <div style="margin-bottom:16px; display:flex; gap:8px; align-items:center">
    <input type="password" id="adminKey" placeholder="Admin anahtarı" value="famicare-admin-2026" style="margin-bottom:0; flex:1; max-width:300px" />
    <button class="btn" onclick="loadAll()">Bağlan</button>
  </div>

  <div class="card" style="padding:8px 20px">
    <span class="tab active" onclick="switchTab('dashboard',this)">📊 Dashboard</span>
    <span class="tab" onclick="switchTab('users',this)">👥 Kullanıcılar</span>
    <span class="tab" onclick="switchTab('profiles',this)">👤 Profiller</span>
    <span class="tab" onclick="switchTab('drugs',this)">💊 İlaç Katalog</span>
    <span class="tab" onclick="switchTab('db',this)">🗄️ Veritabanı</span>
  </div>

  <div id="tab-dashboard" class="tab-content active">
    <div class="card"><div class="grid" id="statsGrid"></div></div>
    <div class="card" style="display:flex; gap:8px; flex-wrap:wrap">
      <button class="btn" onclick="importDrugs()">📥 TİTCK Import</button>
      <button class="btn" onclick="matchRxNav()">🔗 RxNav Eşleştir</button>
      <button class="btn btn-danger" onclick="clearAll()">🗑️ Tüm Veriyi Temizle</button>
      <div id="actionLog" class="log" style="margin-top:12px; width:100%">Hazır</div>
    </div>
  </div>

  <div id="tab-users" class="tab-content">
    <div class="card"><div style="overflow-x:auto"><table><thead><tr><th>Ad</th><th>Telefon</th><th>Rol</th><th>Kayıt</th><th>İşlem</th></tr></thead><tbody id="usersTable"></tbody></table></div></div>
  </div>

  <div id="tab-profiles" class="tab-content">
    <div class="card"><div style="overflow-x:auto"><table><thead><tr><th>Ad</th><th>Caregiver</th><th>Bağlantı</th><th>Kod</th><th>İşlem</th></tr></thead><tbody id="profilesTable"></tbody></table></div></div>
  </div>

  <div id="tab-drugs" class="tab-content">
    <div class="card">
      <input type="text" id="drugSearch" placeholder="İlaç ara..." oninput="searchDrugs()" style="width:100%" />
      <div style="overflow-x:auto; margin-top:12px"><table><thead><tr><th>İlaç</th><th>Barkod</th><th>ATC</th><th>Durum</th></tr></thead><tbody id="drugsTable"></tbody></table></div>
    </div>
  </div>

  <div id="tab-db" class="tab-content">
    <div class="card">
      <p style="margin-bottom:12px; color:#64748b; font-size:14px">Veritabanı: <strong id="dbStatus">JSON</strong></p>
      <p style="margin-bottom:12px; color:#64748b; font-size:14px">İlaç sayısı: <strong id="drugCount">0</strong></p>
      <p style="color:#64748b; font-size:14px">Son import: <strong id="lastImport">-</strong></p>
    </div>
  </div>
</div>

<script>
const BASE = window.location.origin + '/api/v1/admin';
function key() { return document.getElementById('adminKey').value; }
function h() { return { 'Content-Type':'application/json', 'x-admin-key':key() }; }
async function api(path, opts={}) {
  const r = await fetch(BASE+path, {...opts, headers:{...h(),...opts.headers}});
  if(!r.ok) { const e=await r.json(); throw new Error(e.error||'Hata'); }
  return r.json();
}
function switchTab(name,el) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
  if(name==='users') loadUsers();
  if(name==='profiles') loadProfiles();
}

async function loadAll() {
  try {
    const s = await api('/stats');
    document.getElementById('statsGrid').innerHTML = `
      <div class="stat"><div class="stat-value">${s.users}</div><div class="stat-label">Kullanıcı</div></div>
      <div class="stat"><div class="stat-value">${s.medications}</div><div class="stat-label">İlaç Kaydı</div></div>
      <div class="stat"><div class="stat-value">${s.activeDrugs}</div><div class="stat-label">Aktif İlaç</div></div>
      <div class="stat"><div class="stat-value">${s.totalDrugs}</div><div class="stat-label">Toplam İlaç</div></div>
      <div class="stat"><div class="stat-value">${s.healthRecords}</div><div class="stat-label">Sağlık</div></div>
      <div class="stat"><div class="stat-value">${s.appointments}</div><div class="stat-label">Randevu</div></div>
      <div class="stat"><div class="stat-value">${s.notifications}</div><div class="stat-label">Bildirim</div></div>
      <div class="stat"><div class="stat-value">${s.lastImport ? new Date(s.lastImport).toLocaleDateString('tr-TR') : '-'}</div><div class="stat-label">Son İmport</div></div>`;
    document.getElementById('drugCount').textContent = s.totalDrugs;
    document.getElementById('lastImport').textContent = s.lastImport ? new Date(s.lastImport).toLocaleString('tr-TR') : '-';
    document.getElementById('dbStatus').textContent = s.pgConnected ? 'PostgreSQL ✅' : 'JSON ⚠️';
    log('✅ Veriler yüklendi');
  } catch(e) { log('❌ Hata: '+e.message); }
}

async function loadUsers() {
  try {
    const u = await api('/users');
    document.getElementById('usersTable').innerHTML = u.map(x => `<tr><td><strong>${x.name}</strong></td><td>${x.phone||'-'}</td><td><span class="badge ${x.role==='caregiver'?'badge-blue':'badge-green'}">${x.role}</span></td><td>${new Date(x.createdAt).toLocaleDateString('tr-TR')}</td><td><button class="btn btn-sm btn-danger" onclick="deleteUser('${x.id}','${x.name.replace(/'/g,"\\'")}')">🗑</button></td></tr>`).join('');
  } catch(e) { log('❌ Kullanıcılar yüklenemedi: '+e.message); }
}

async function loadProfiles() {
  try {
    const p = await api('/profiles');
    document.getElementById('profilesTable').innerHTML = p.map(x => `<tr><td><strong>${x.name}</strong></td><td style="font-size:11px;color:#64748b">${(x.caregiverId||'').slice(0,8)}...</td><td>${x.linkedUserId ? '✅ Bağlı' : '❌ Boş'}</td><td style="font-size:12px">${x.inviteCode||'-'}</td><td><button class="btn btn-sm btn-danger" onclick="deleteProfile('${x.id}','${x.name.replace(/'/g,"\\'")}')">🗑</button></td></tr>`).join('');
  } catch(e) { log('❌ Profiller yüklenemedi: '+e.message); }
}

async function searchDrugs() {
  const q = document.getElementById('drugSearch').value;
  if(q.length < 2) { document.getElementById('drugsTable').innerHTML = ''; return; }
  try {
    const d = await fetch(window.location.origin + '/api/v1/drugs/search?q='+encodeURIComponent(q), { headers: h() }).then(r=>r.json());
    document.getElementById('drugsTable').innerHTML = d.slice(0,50).map(x => `<tr><td><strong>${x.ilac_adi}</strong></td><td style="font-size:11px">${x.barkod}</td><td style="font-size:11px">${x.atc_kodu||'-'}</td><td><span class="badge ${x.durum==='aktif'?'badge-green':'badge-red'}">${x.durum}</span></td></tr>`).join('');
  } catch {}
}

async function deleteUser(id, name) {
  if(!confirm('"' + name + '" ve tüm verileri silinsin mi?')) return;
  try { await api('/users/'+id, {method:'DELETE'}); loadUsers(); log('✅ "'+name+'" silindi'); } catch(e) { log('❌ '+e.message); }
}
async function deleteProfile(id, name) {
  if(!confirm('"' + name + '" silinsin mi?')) return;
  try { await api('/profiles/'+id, {method:'DELETE'}); loadProfiles(); log('✅ "'+name+'" silindi'); } catch(e) { log('❌ '+e.message); }
}
async function importDrugs() {
  log('⏳ TİTCK import başlatılıyor...');
  try { const r = await api('/import-drugs', {method:'POST'}); log('✅ '+(r.message||'Tamam')); loadAll(); } catch(e) { log('❌ '+e.message); }
}
async function matchRxNav() {
  log('⏳ RxNav eşleştirme...');
  try { const r = await api('/match-rxnav', {method:'POST'}); log(`✅ Eşleşen: ${r.matched}, Başarısız: ${r.failed}, Kalan: ${r.remaining}`); } catch(e) { log('❌ '+e.message); }
}
async function clearAll() {
  if(!confirm('Tüm kullanıcı, profil, ilaç, randevu ve sağlık verileri silinsin mi?')) return;
  try { await api('/clear-all', {method:'POST'}); loadAll(); log('✅ Tüm veri temizlendi'); } catch(e) { log('❌ '+e.message); }
}
function log(m) {
  const el = document.getElementById('actionLog');
  el.textContent += '\n['+new Date().toLocaleTimeString('tr-TR')+'] '+m;
  el.scrollTop = el.scrollHeight;
}
</script>
</body>
</html>
